# The card of a /qc link, for an instance that serves the page:
# docker-entrypoint.d/42-awful-cards.sh puts this where nginx.conf includes it
# when USE_QC is on. Off, the path answers with the landing page, and its
# card says so.
#
# The same rewriting as /r/ in nginx.conf, where the reasons are written down.
# The words are page-meta.ts's, which sets them again once the page runs;
# og-subfilter.test.ts holds the two together.
location ~ ^/qc(/|$) {
    sub_filter_once off;
    sub_filter 'https://awful.chat/og.png' 'https://$host/og-qc.png';
    sub_filter 'Awful.chat - No need to expose your identity to have a conversation.' 'Start a video call with no account - Awful.chat';
    sub_filter 'content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."' 'content="A video call from one link: camera, screen share and text chat, with no account and no sign-up. Voice is peer-to-peer. Nothing is kept - close the tab and the call and its chat are gone."';
    sub_filter 'content="Awful.chat: private, peer-to-peer chat with voice, video and files"' 'content="Awful.chat: video calls with no account"';
    sub_filter 'content="https://awful.chat"' 'content="https://$host/qc"';
    sub_filter 'href="https://awful.chat"' 'href="https://$host/qc"';
    sub_filter '<title>Awful.chat - private peer-to-peer chat</title>' '<title>Start a video call with no account - Awful.chat</title>';
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Content-Security-Policy $awful_csp always;
    add_header Content-Security-Policy-Report-Only $awful_csp_report_only always;
    add_header Permissions-Policy $awful_permissions_policy always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files /index.html =404;
}
