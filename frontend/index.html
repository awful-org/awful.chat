<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Awful.chat - private peer-to-peer chat</title>
    <link rel="canonical" href="https://awful.chat" />
    <meta
      name="description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="index, follow" />

    <!-- Installed-app behaviour. iOS still reads the apple-prefixed pair, and
         black-translucent lets the app paint under the status bar (index.html
         already sets viewport-fit=cover for the safe-area insets). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Awful.chat" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Awful.chat - No need to expose your identity to have a conversation."
    />
    <meta
      property="og:description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://awful.chat" />
    <!-- OG scrapers require absolute image URLs -->
    <meta property="og:image" content="https://awful.chat/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Awful.chat - end-to-end encrypted P2P chat"
    />
    <meta property="og:site_name" content="Awful.chat" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Awful.chat - No need to expose your identity to have a conversation."
    />
    <meta
      name="twitter:description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta name="twitter:image" content="https://awful.chat/og.png" />
    <meta
      name="twitter:image:alt"
      content="Awful.chat - end-to-end encrypted P2P chat"
    />

    <link rel="icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      sizes="180x180"
    />
    <link rel="mask-icon" href="/logo.svg" color="#09090b" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Awful.chat",
        "url": "https://awful.chat",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Web",
        "description": "End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "browserRequirements": "Requires a modern browser with WebRTC support"
      }
    </script>
    <!-- Mirrors the FAQ section in Landing.svelte - keep the two in sync. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need a phone number or an email?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Your identity is a 12-word seed phrase generated on your device - it derives your keypair, and there is no account to create and nothing to hand over."
            }
          },
          {
            "@type": "Question",
            "name": "Can the server read my messages?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Chat messages, files and voice calls are end-to-end encrypted and travel peer-to-peer - the relay introduces peers, forwards encrypted traffic, and holds a 48-hour encrypted mailbox for offline DMs it cannot open (on by default, can be turned off in settings). The one exception is group video and screen share, which route through the SFU server."
            }
          },
          {
            "@type": "Question",
            "name": "Can I host it myself?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The whole stack is open source and ships as one Docker Compose file: the web app, a Go relay, a mediasoup SFU and a TURN server. Clone the repo, set a few env vars, run one docker compose command, and you have your own private chat instance."
            }
          },
          {
            "@type": "Question",
            "name": "How do voice and video calls work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Voice is always peer-to-peer over WebRTC. Group video and screen share go through a mediasoup SFU so many people can watch without melting anyone's upload bandwidth."
            }
          },
          {
            "@type": "Question",
            "name": "Does it have plugins?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Instances can ship plugins - watch-together listening parties, polls, a shared-Steam-library roulette - and a curated collection is maintained at https://github.com/awful-org/awfully-awesome. Operators pull them in with one deploy variable, and anyone can write their own."
            }
          },
          {
            "@type": "Question",
            "name": "What if I lose my seed phrase?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is gone, and so is the identity - there is no reset email because there is no account. Back up the 12 words; syncing a second device via QR code also works as a backup."
            }
          },
          {
            "@type": "Question",
            "name": "Is it really free and open source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Apache-2.0, source on GitHub, no premium tier, no data harvesting to pay for it."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
