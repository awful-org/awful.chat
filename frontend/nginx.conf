# Content-Security-Policy for the documents this server hands out. Two nginx
# mechanics shape where it can live:
#
#   - add_header is NOT inherited into a block that declares its own
#     add_header, and both blocks that serve index.html already declare a
#     Cache-Control - so the policy has to be repeated there. The map keeps
#     that to one line per block.
#   - only the response that DELIVERS a document (or a worker script) carries
#     a policy the browser enforces, so /assets/ and the og images need none.
#
# Why each source is in the list:
#   script-src   the bundle is same-origin and the built output contains no
#                eval() and no new Function() (checked against dist/), so
#                'unsafe-eval' is not needed - but shiki's oniguruma engine
#                and the DTLN worklet both instantiate WebAssembly, which
#                needs 'wasm-unsafe-eval'. www.youtube.com / s.ytimg.com is
#                the iframe player API the watch-together plugin injects;
#                analytics.frav.in is the landing page's umami script.
#   style-src    'unsafe-inline' is unavoidable: nickname colours and Svelte
#                templates both end up in style attributes.
#   img-src      avatars and GIF links are arbitrary user-supplied URLs
#                (normalizeAvatarUrl accepts any http/https URL), attachments
#                render from blob:, device-picked avatars from data:.
#   connect-src  deliberately open. The relay origin, the SFU URL and the
#                plugin-proxy hosts are all deploy-time configuration
#                (VITE_API_URL, VITE_RELAY_MULTIADDR, VITE_SFU_URL) that this
#                static file cannot know, and a wrong guess takes the whole
#                app offline. The tight version ships as Report-Only instead.
map $host $awful_csp {
    default "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com https://s.ytimg.com https://analytics.frav.in; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https:; frame-src 'self' https://www.youtube.com; worker-src 'self' blob:; connect-src 'self' data: blob: https: wss: ws:";
}

# The connect-src the app needs when the relay sits at relay.<this host>,
# which is what docker-compose.dokploy.yml provisions. Report-Only, so an
# instance that does not match that convention logs violations to the console
# instead of losing its transport: an operator who sees a clean console can
# fold this into the enforced policy above.
map $host $awful_csp_report_only {
    default "connect-src 'self' data: blob: https://*.$host wss://*.$host https://cdn.jsdelivr.net https://www.youtube.com https://analytics.frav.in";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't hand out the nginx version in error pages and the Server header -
    # free reconnaissance for anyone probing for a known CVE.
    server_tokens off;

    # Compression - page speed feeds Core Web Vitals / SEO
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml image/svg+xml;

    # Inherited by every block below that does not declare an add_header of
    # its own; the two that serve index.html repeat them.
    add_header Content-Security-Policy $awful_csp always;
    add_header Content-Security-Policy-Report-Only $awful_csp_report_only always;

    #TODO: change this to subdomain too
    # Proxy mediasoup SFU WebSocket signaling
    location /sfu {
        proxy_pass http://sfu:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Serve static assets directly
    location /og.png {
        alias /usr/share/nginx/html/og.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /og-invite.png {
        alias /usr/share/nginx/html/og-invite.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
    }

    location /manifest.webmanifest {
        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    location /apple-touch-icon-180x180.png {
        alias /usr/share/nginx/html/apple-touch-icon-180x180.png;
        expires 30d;
    }

    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 30d;
    }

    location /pwa- {
        alias /usr/share/nginx/html/pwa-;
        expires 30d;
    }

    location /sw.js {
        alias /usr/share/nginx/html/sw.js;
        expires -1;
    }

    location /workbox- {
        alias /usr/share/nginx/html/workbox-;
        expires 30d;
    }

    # Hashed build assets never change - cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Invite links get their own preview card: scrapers never run JS, so the
    # meta tags are rewritten server-side for /r/* while the SPA bundle stays
    # identical. sub_filter runs before gzip, so compression is unaffected.
    location ~ ^/r/ {
        sub_filter_once off;
        sub_filter 'https://awful.frav.in/og.png' 'https://awful.frav.in/og-invite.png';
        sub_filter 'content="630"' 'content="635"';
        sub_filter 'Awful.chat - No need to expose your identity to have a conversation.' 'You are invited to a private room on Awful.chat';
        sub_filter 'content="https://awful.frav.in"' 'content="https://awful.frav.in$request_uri"';
        # The canonical link was left pointing at the homepage, which tells
        # every crawler that honours it "this page is really /" - so the room
        # card it rendered was the homepage's, no matter how correct the og:
        # tags above are. It uses href=, not content=, so the rewrite one line
        # up never touched it.
        sub_filter 'href="https://awful.frav.in"' 'href="https://awful.frav.in$request_uri"';
        # Scrapers with no og:title, and the browser tab, both fall back here.
        sub_filter '<title>Awful.chat</title>' '<title>You are invited to a private room on Awful.chat</title>';
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $awful_csp always;
        add_header Content-Security-Policy-Report-Only $awful_csp_report_only always;
        try_files /index.html =404;
    }

    # SPA fallback - all unknown paths serve index.html.
    #
    # no-cache means "revalidate before use", not "do not store": index.html
    # names the hashed bundle, so a browser holding an old copy keeps loading
    # the old build. It had no cache headers at all, which makes it
    # heuristically cacheable, and the result was a deploy that only took
    # effect once someone happened to hard-reload.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $awful_csp always;
        add_header Content-Security-Policy-Report-Only $awful_csp_report_only always;
        try_files $uri $uri/ /index.html;
    }
}
