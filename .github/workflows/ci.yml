# Runs on every PR and on every push to main. main is what Dokploy deploys, so
# nothing reaches it without these four jobs going green: protect the branch
# and require them as status checks (Settings > Branches > main).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # The real build, plugin fetch included, so a broken Dockerfile input
      # fails here and not on the VPS.
      # Builds the way a deploy does, so the commit is resolved from .git by
      # frontend/scripts/git-commit.mjs and that path is exercised here.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The regression this repo's instance configuration exists to prevent,
      # checked from both ends because neither end catches both shapes.
      #
      # A DYNAMIC read (import.meta.env, the whole object) is replaced by an
      # object literal carrying every VITE_ variable, so the names show up in
      # the output. A STATIC read (import.meta.env.VITE_API_URL) is replaced
      # by the value alone, and the name never appears - grepping dist would
      # not have seen it. That is not hypothetical: a plugin did exactly
      # that, and it took fingerprinting a deployed instance and diffing it
      # against a local build of the same commit to find.
      #
      # Fetched plugins are checked at fetch time instead, in
      # scripts/fetch-plugins.mjs, since PLUGIN_SOURCES is empty here.
      - name: no build-time env reads outside runtime-config
        run: |
          # Whole-line comments are dropped so the code that documents this
          # hazard does not trip the check that enforces it. Only whole
          # lines: a leak sharing a line with code still has to be seen.
          if grep -rn --include='*.ts' --include='*.svelte' \
              'import\.meta\.env\.VITE_\|import\.meta\.env\[' src plugins \
              | grep -v 'src/lib/runtime-config.ts' \
              | grep -vE ':[0-9]+: *(//|\*|/\*)'; then
            echo "::error::vite inlines these, which puts the instance's own addresses into the bundle. Use runtime-config.ts."
            exit 1
          fi

      - name: no instance configuration in the bundle
        run: |
          if grep -rl 'VITE_API_URL\|VITE_RELAY_MULTIADDR\|VITE_SFU_URL' dist/; then
            echo "::error::build-time env leaked into the bundle - see src/lib/runtime-config.ts"
            exit 1
          fi

  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: relay/go.mod, cache-dependency-path: relay/go.sum }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Fails only on vulnerabilities in code the relay actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sfu:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sfu } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: sfu/package-lock.json }
      # Downloads mediasoup's prebuilt worker; the tests spawn the real thing.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Every image builds from a clean context. Catches a Dockerfile that only
  # worked because of something lying around on the VPS.
  images:
    # Named explicitly. Without this the check name is built from every
    # matrix value ("images (relay, relay)"), so adding one key renames it -
    # and a renamed check that is required in branch protection never
    # reports, blocking every PR on a job that no longer exists.
    name: images (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: relay, context: relay, dockerfile: relay/Dockerfile }
          - { name: sfu, context: sfu, dockerfile: sfu/Dockerfile }
          # The repo root, so the build can read .git and resolve its own
          # commit. See frontend/Dockerfile.
          - { name: frontend, context: ".", dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
