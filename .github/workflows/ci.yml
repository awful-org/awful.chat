# Runs on every PR and on every push to main. main is what Dokploy deploys, so
# nothing reaches it without these four jobs going green: protect the branch
# and require them as status checks (Settings > Branches > main).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # The real build, plugin fetch included, so a broken Dockerfile input
      # fails here and not on the VPS.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: relay/go.mod, cache-dependency-path: relay/go.sum }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Fails only on vulnerabilities in code the relay actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sfu:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sfu } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: sfu/package-lock.json }
      # Downloads mediasoup's prebuilt worker; the tests spawn the real thing.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Every image builds from a clean context. Catches a Dockerfile that only
  # worked because of something lying around on the VPS.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: relay, context: relay }
          - { name: sfu, context: sfu }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            VITE_API_URL=https://relay.example.com
            VITE_RELAY_MULTIADDR=/dns4/relay.example.com/tcp/443/wss/p2p/12D3KooWExampleExampleExampleExampleExampleExampleExample
