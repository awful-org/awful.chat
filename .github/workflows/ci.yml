# Runs on every PR and on every push to main. main is what Dokploy deploys, so
# nothing reaches it without these five jobs going green: protect the branch
# and require them as status checks (Settings > Branches > main).
#
# On a pull request, a job whose code the PR does not touch is skipped (see
# `changes`). A push to main runs everything. The skipping is done with `if:`
# on jobs and steps, never with `paths:` on the trigger: a required check
# whose workflow never starts stays "expected" forever and blocks the merge,
# while a job skipped by `if:` reports success.
#
# Every `uses:` here and in the other two workflows names a COMMIT, with the
# tag it was cut from in the comment beside it. A tag is a movable pointer in
# somebody else's repository, so `@v7` is a standing invitation to run whatever
# that pointer is made to mean tomorrow - in a job that holds this repo's
# token. Bump one by resolving the tag again:
#   git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<tag>
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo this run has to check. Each output is "true" or
  # "false". The jobs below run unless their output is exactly "false", so if
  # this job fails or is cancelled they all run: a broken detector must cost
  # time, never let a change through unchecked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      frontend_image: ${{ steps.diff.outputs.frontend_image }}
      relay: ${{ steps.diff.outputs.relay }}
      sfu: ${{ steps.diff.outputs.sfu }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
    steps:
      # A pull request is checked out as GitHub's merge of it into its base,
      # so the merge's first parent is the base and the diff between them is
      # exactly what the PR changes once merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with: { fetch-depth: 2 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          areas="frontend frontend_image relay sfu dashboard"
          if [ "$EVENT" != pull_request ]; then
            for a in $areas; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            echo "Not a pull request: everything runs."
            exit 0
          fi
          # --no-renames: a moved file is listed at both its old path and its
          # new one, so the area it left is checked as well as the one it
          # reached.
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf 'Changed:\n%s\n' "$files"
          # The workflows themselves can change what any job does.
          all=false
          if grep -q '^\.github/' <<<"$files"; then all=true; fi
          check() { # area, then the paths it reads
            local area=$1; shift
            local hit=$all
            for p in "$@"; do
              # A plain prefix match: index(), not a regex, so the dot in
              # ".dockerignore" means a dot.
              if awk -v p="$p" 'index($0, p) == 1 { f = 1 } END { exit !f }' <<<"$files"; then hit=true; fi
            done
            echo "$area=$hit" >> "$GITHUB_OUTPUT"
            echo "$area: $hit"
          }
          # The frontend's tests import the SFU's auth code (sfu/auth.ts) to
          # prove both ends agree, and its job installs the SFU's packages.
          check frontend frontend/ sfu/
          # The frontend image's context is the repo root, trimmed by the
          # root .dockerignore; it takes nothing from sfu/.
          check frontend_image frontend/ .dockerignore
          check relay relay/
          check sfu sfu/
          check dashboard dashboard/

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # The browser/SFU auth interoperability test imports the real server
      # verifier. Install its locked dependencies without downloading/building
      # mediasoup's worker; the separate SFU job tests the worker itself.
      - name: install SFU dependencies for auth interoperability checks
        run: npm ci --ignore-scripts
        working-directory: sfu
      - run: pnpm check
      - run: pnpm test
      # The real build, plugin fetch included, so a broken Dockerfile input
      # fails here and not on the VPS.
      # Builds the way a deploy does, so the commit is resolved from .git by
      # frontend/scripts/git-commit.mjs and that path is exercised here.
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The regression this repo's instance configuration exists to prevent,
      # checked from both ends because neither end catches both shapes.
      #
      # A DYNAMIC read (import.meta.env, the whole object) is replaced by an
      # object literal carrying every VITE_ variable, so the names show up in
      # the output. A STATIC read (import.meta.env.VITE_API_URL) is replaced
      # by the value alone, and the name never appears - grepping dist would
      # not have seen it. That is not hypothetical: a plugin did exactly
      # that, and it took fingerprinting a deployed instance and diffing it
      # against a local build of the same commit to find.
      #
      # Fetched plugins are checked at fetch time instead, in
      # scripts/fetch-plugins.mjs, since PLUGIN_SOURCES is empty here.
      - name: no build-time env reads outside runtime-config
        run: |
          # Whole-line comments are dropped so the code that documents this
          # hazard does not trip the check that enforces it. Only whole
          # lines: a leak sharing a line with code still has to be seen.
          if grep -rn --include='*.ts' --include='*.svelte' \
              'import\.meta\.env\.VITE_\|import\.meta\.env\[' src plugins \
              | grep -v 'src/lib/runtime-config.ts' \
              | grep -vE ':[0-9]+: *(//|\*|/\*)'; then
            echo "::error::vite inlines these, which puts the instance's own addresses into the bundle. Use runtime-config.ts."
            exit 1
          fi

      - name: no instance configuration in the bundle
        run: |
          if grep -rl 'VITE_API_URL\|VITE_RELAY_MULTIADDR\|VITE_SFU_URL' dist/; then
            echo "::error::build-time env leaked into the bundle - see src/lib/runtime-config.ts"
            exit 1
          fi

  relay:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: relay/go.mod, cache-dependency-path: relay/go.sum }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Fails only on vulnerabilities in code the relay actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sfu:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sfu != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sfu } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm, cache-dependency-path: sfu/package-lock.json }
      # Downloads mediasoup's prebuilt worker; the tests spawn the real thing.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # The operator console. NOT in the images matrix below: it is not deployed,
  # so there is no Dockerfile to build. It is gated here because its analysis
  # engine is the thing that reads a bundle, and a broken engine is worse than
  # no engine - it names the wrong root cause.
  dashboard:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dashboard != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      # The dashboard has no runtime-config file at all: it is served from a
      # developer's own machine and the operator types the relay address in.
      # The same guard as the frontend's, so a build-time address cannot creep
      # in later.
      - name: no build-time env reads
        run: |
          if grep -rn --include='*.ts' --include='*.svelte' \
              'import\.meta\.env\.VITE_\|import\.meta\.env\[' src \
              | grep -vE ':[0-9]+: *(//|\*|/\*)'; then
            echo "::error::the dashboard has no runtime configuration - the operator supplies the relay address at run time."
            exit 1
          fi

  # Every image builds from a clean context. Catches a Dockerfile that only
  # worked because of something lying around on the VPS.
  images:
    # Named explicitly. Without this the check name is built from every
    # matrix value ("images (relay, relay)"), so adding one key renames it -
    # and a renamed check that is required in branch protection never
    # reports, blocking every PR on a job that no longer exists.
    name: images (${{ matrix.name }})
    needs: changes
    # Skipped per image at the step level, not here: a job-level `if:` cannot
    # see the matrix, and a matrix job skipped as a whole reports under its
    # unexpanded name ("images (${{ matrix.name }})"), which is not the
    # required check and would leave it waiting.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: relay, context: relay, dockerfile: relay/Dockerfile, gate: relay }
          - { name: sfu, context: sfu, dockerfile: sfu/Dockerfile, gate: sfu }
          # The repo root, so the build can read .git and resolve its own
          # commit. See frontend/Dockerfile.
          - { name: frontend, context: ".", dockerfile: frontend/Dockerfile, gate: frontend_image }
    steps:
      - if: needs.changes.outputs[matrix.gate] == 'false'
        run: echo "Nothing this image is built from changed; not building it."
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
