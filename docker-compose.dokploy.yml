services:
  relay:
    build:
      context: ./relay
    restart: unless-stopped
    # Drops every capability and blocks privilege escalation - this process
    # never needs raw sockets, chown, or setuid. No read_only: not worth the
    # breakage risk to verify today.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nothing rotates docker's json-file driver by default, so any log path a
    # remote party can drive - and the relay has several - fills the host
    # volume and takes every other service down with it. 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
      - "8081"
    environment:
      - HTTP_PORT=8080
      - KLIPY_API_KEY=${KLIPY_API_KEY}
      - NODE_ENV=production
      # DOMAIN is the FRONTEND origin (CORS gate). The relay's own hostname
      # is RELAY_DOMAIN below and defaults to relay.${DOMAIN} - set it when
      # the relay lives under another name (a dev-relay.example.com), and
      # keep VITE_API_URL / VITE_RELAY_MULTIADDR pointing at the same name.
      - DOMAIN=${DOMAIN}
      # Shared with coturn below, which now REQUIRES it (--use-auth-secret).
      # The relay mints a short-lived HMAC credential per client; there are no
      # bundled fallback credentials any more, so unset means no TURN at all
      # and relayed peers (mobile, CGNAT) cannot connect. See README.
      - TURN_SECRET=${TURN_SECRET:-}
      # The hostname the relay puts in the TURN urls it mints. Falls back to
      # DOMAIN, which is wrong whenever DOMAIN is behind a CDN: a proxied name
      # forwards neither UDP nor raw TCP, so TURN silently points at something
      # that cannot serve it and mobile/CGNAT peers just time out.
      - TURN_HOST=${TURN_HOST:-}
      - TURN_URLS=${TURN_URLS:-}
      # Generic plugin proxy: allowlisted upstream hosts and named secrets
      # substituted server-side ({{secret:NAME}}). Bind secrets to their
      # host - NAME@host=value - so no other allowlisted upstream can ever
      # receive them. What keeps API-using plugins "env + redeploy".
      - PLUGIN_PROXY_HOSTS=${PLUGIN_PROXY_HOSTS:-}
      - PLUGIN_PROXY_SECRETS=${PLUGIN_PROXY_SECRETS:-}
    volumes:
      - relay_data:/app/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.relay-http.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`)
      - traefik.http.routers.relay-http.entrypoints=web
      - traefik.http.routers.relay-http.middlewares=relay-redirect
      - traefik.http.routers.relay-https.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`)
      - traefik.http.routers.relay-https.entrypoints=websecure
      - traefik.http.routers.relay-https.middlewares=relay-sec
      - traefik.http.routers.relay-https.tls=true
      - traefik.http.routers.relay-https.tls.certresolver=letsencrypt
      - traefik.http.services.relay-service.loadbalancer.server.port=8080
      - traefik.http.routers.relay-https.service=relay-service
      - traefik.http.routers.relay-http.service=relay-service
      - traefik.http.middlewares.relay-redirect.redirectscheme.scheme=https
      # The redirectscheme above upgrades one request; HSTS is what makes the
      # browser remember to. It has to hang off the https routers - a browser
      # ignores Strict-Transport-Security on a plain-http response - and off
      # every one of them, because a client that only ever calls /klipy would
      # otherwise never be told. stsPreload just sets the header flag;
      # submitting the domain to the preload list is a separate manual step.
      - traefik.http.middlewares.relay-sec.headers.stsSeconds=63072000
      - traefik.http.middlewares.relay-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.relay-sec.headers.stsPreload=true
      - traefik.http.middlewares.relay-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.relay-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.relay-sec.headers.frameDeny=true
      - traefik.http.routers.og.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/og`)
      - traefik.http.routers.og.entrypoints=websecure
      - traefik.http.routers.og.middlewares=relay-sec
      - traefik.http.routers.og.tls=true
      - traefik.http.routers.og.tls.certresolver=letsencrypt
      - traefik.http.routers.og.service=relay-api-service
      - traefik.http.services.relay-api-service.loadbalancer.server.port=8081
      - traefik.http.routers.klipy.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/klipy`)
      - traefik.http.routers.klipy.entrypoints=websecure
      - traefik.http.routers.klipy.middlewares=relay-sec
      - traefik.http.routers.klipy.tls=true
      - traefik.http.routers.klipy.tls.certresolver=letsencrypt
      - traefik.http.routers.klipy.service=relay-api-service
      - traefik.http.routers.turn.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/turn-credentials`)
      - traefik.http.routers.turn.entrypoints=websecure
      - traefik.http.routers.turn.middlewares=relay-sec
      - traefik.http.routers.turn.tls=true
      - traefik.http.routers.turn.tls.certresolver=letsencrypt
      - traefik.http.routers.turn.service=relay-api-service
      - traefik.http.routers.steam.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/plugin-proxy`)
      - traefik.http.routers.steam.entrypoints=websecure
      - traefik.http.routers.steam.middlewares=relay-sec
      - traefik.http.routers.steam.tls=true
      - traefik.http.routers.steam.tls.certresolver=letsencrypt
      - traefik.http.routers.steam.service=relay-api-service
      - traefik.http.routers.invite.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/invite`)
      - traefik.http.routers.invite.entrypoints=websecure
      - traefik.http.routers.invite.middlewares=relay-sec
      - traefik.http.routers.invite.tls=true
      - traefik.http.routers.invite.tls.certresolver=letsencrypt
      - traefik.http.routers.invite.service=relay-api-service
      - traefik.http.routers.mailbox.rule=Host(`${RELAY_DOMAIN:-relay.${DOMAIN}}`) && PathPrefix(`/mailbox`)
      - traefik.http.routers.mailbox.entrypoints=websecure
      - traefik.http.routers.mailbox.middlewares=relay-sec
      - traefik.http.routers.mailbox.tls=true
      - traefik.http.routers.mailbox.tls.certresolver=letsencrypt
      - traefik.http.routers.mailbox.service=relay-api-service

  sfu:
    build:
      context: ./sfu
    restart: unless-stopped
    # Drops every capability and blocks privilege escalation. No read_only:
    # mediasoup writes to tmp paths at runtime, not worth the breakage risk
    # to verify today.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nothing rotates docker's json-file driver by default, so any log path a
    # remote party can drive - and the relay has several - fills the host
    # volume and takes every other service down with it. 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
    # ONE pair of variables drives both the published range and the range
    # mediasoup actually allocates from. They used to be four (RTC_MIN/RTC_MAX
    # plus a whole PORTS_UDP/PORTS_TCP mapping string) that had to be kept in
    # sync by hand, and a mismatch fails in the worst way: media allocates on
    # a port the host never published, so the call connects and then nobody
    # hears anything.
    #
    # Two constraints on the range itself, both of which bite at `up` time:
    #
    #   Keep it above 60999. Docker binds every port in the range when the
    #   container starts and one port already in use aborts the whole
    #   container, so a range inside Linux's ephemeral window (32768-60999)
    #   makes the SFU fail to start at random - typically after a reboot.
    #
    #   Set {"userland-proxy": false} in /etc/docker/daemon.json and restart
    #   docker BEFORE the first `up`. Otherwise docker starts one proxy
    #   PROCESS per published port per protocol: 500 ports twice measured at
    #   2000 processes and 8.4 GB, which OOMs a small VPS. With the flag off
    #   the range is pure iptables DNAT and costs nothing.
    ports:
      - ${SFU_RTC_MIN_PORT:-61000}-${SFU_RTC_MAX_PORT:-61499}:${SFU_RTC_MIN_PORT:-61000}-${SFU_RTC_MAX_PORT:-61499}/udp
      - ${SFU_RTC_MIN_PORT:-61000}-${SFU_RTC_MAX_PORT:-61499}:${SFU_RTC_MIN_PORT:-61000}-${SFU_RTC_MAX_PORT:-61499}/tcp
    environment:
      NODE_ENV: production
      SFU_PORT: "3000"
      ANNOUNCED_IP: ${ANNOUNCED_IP:?ANNOUNCED_IP must be set to the server public IP}
      RTC_MIN_PORT: ${SFU_RTC_MIN_PORT:-61000}
      RTC_MAX_PORT: ${SFU_RTC_MAX_PORT:-61499}
      # Documented as an instance variable but never passed through, so
      # setting it in .env did nothing and the SFU kept its built-in default.
      SFU_MAX_ROOMS: ${SFU_MAX_ROOMS:-250}
    networks:
      - dokploy-network

  # For TLS TURN (turns: - strongly recommended for mobile-carrier users):
  # put fullchain.pem + privkey.pem for the domain in a directory, set
  #   TURN_TLS_DIR=/path/to/certs
  #   TURN_TLS_ARGS=--cert=/certs/fullchain.pem --pkey=/certs/privkey.pem
  # and uncomment the volumes line below.
  #
  # Relay port range: 51 ports. Production was returning "508 Cannot create
  # socket" on every allocation (measured, five for five) with this same
  # range, but the range was the ceiling, not the cause - the client was
  # spending roughly 20 allocations per peer connection because
  # iceCandidatePoolSize was 10 and four TURN urls were advertised. With the
  # pool size gone and the dead urls removed that is ~2 per connection, and 51
  # is comfortable for the current handful of users. Bumped to 100 for
  # headroom anyway - with network_mode: host nothing is published per port,
  # so the range size costs nothing at deploy time.
  #
  # Loopback and link-local are denied because host networking puts coturn on
  # the host's stack: without them a relay peer reaches services bound to
  # 127.0.0.1 and the cloud metadata endpoint at 169.254.169.254. That matters
  # all the more while the credentials are a shared secret that ships in the
  # client bundle.
  #
  # network_mode: host rather than published ports - docker publishes a range
  # by starting a userland proxy per port, which does not scale to a usable
  # relay range. coturn speaks raw UDP/TCP and Traefik does not route it, so
  # it has no reason to be on the overlay network.
  #
  # NOTE: 5349 must ALSO be opened in the VPS firewall. tcp/5349 times out
  # while an unused port like tcp/12345 refuses immediately, so packets are
  # being dropped upstream of the host - not a missing listener.
  #
  # No --verbose. coturn guards every line that carries a client's source
  # address behind that flag - the per-session "closed, user <..>, remote
  # <ip:port>" record and the per-permission and per-channel lines - so
  # running verbose wrote the one end-to-end view of who talked to whom into
  # the container log, for as long as the host keeps logs. Errors and startup
  # still print.
  #
  # Keep every argument below a real flag: this is a folded block, so a "#"
  # line here becomes a literal argument rather than a comment.
  coturn:
    # Pinned: a floating :latest changes what runs on every pull with no
    # diff to review. 4.17.2 is the newest 4.x alpine tag as of this pin.
    image: coturn/coturn:4.17.2-alpine
    restart: unless-stopped
    # Only no-new-privileges here, not cap_drop: this is network_mode: host
    # binding low, non-standard ports (3478, 5349, and the relay range), and
    # the official image runs the coturn process as root by default - it
    # never goes through a setuid/setcap drop to a non-root user, so there is
    # no CAP_NET_BIND_SERVICE grant to preserve or capability list to trim.
    # Left alone rather than guessed at.
    security_opt:
      - no-new-privileges:true
    # Nothing rotates docker's json-file driver by default, so any log path a
    # remote party can drive - and the relay has several - fills the host
    # volume and takes every other service down with it. 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # volumes:
    #   - ${TURN_TLS_DIR}:/certs:ro
    command: >
      --log-file=stdout
      --realm=${TURN_REALM:-${DOMAIN}}
      --external-ip=${ANNOUNCED_IP}
      --listening-ip=0.0.0.0
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set - see .env.example}
      --fingerprint
      --no-multicast-peers
      --no-tcp-relay
      --alt-listening-port=5349
      --denied-peer-ip=${ANNOUNCED_IP}
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=224.0.0.0-255.255.255.255
      --denied-peer-ip=::1
      --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --min-port=${TURN_MIN_PORT:-49152}
      --max-port=${TURN_MAX_PORT:-50151}
      --total-quota=${TURN_TOTAL_QUOTA:-300}
      --user-quota=${TURN_USER_QUOTA:-12}
      ${TURN_TLS_ARGS:-}
    network_mode: host

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_RELAY_MULTIADDR=${VITE_RELAY_MULTIADDR}
        # One SFU, or a comma-separated list. Rooms are placed across a list
        # by hashing the room code, so participants agree without a
        # coordinator. Empty = this origin's own /sfu.
        - VITE_SFU_URL=${VITE_SFU_URL:-}
        - VITE_SFU_URLS=${VITE_SFU_URLS:-}
        # External plugins fetched at build time; see frontend/plugins/README.md
        - PLUGIN_SOURCES=${PLUGIN_SOURCES:-}
        # Unpinned sources fail the build unless this is 1 (ships HEAD).
        - PLUGIN_SOURCES_ALLOW_UNPINNED=${PLUGIN_SOURCES_ALLOW_UNPINNED:-}
    restart: unless-stopped
    # Drops every capability except what the stock nginx image needs: the
    # master starts as root and setuid/setgids its workers to the nginx user
    # (SETUID, SETGID), and the entrypoint chowns its cache dirs (CHOWN).
    # Port 80 needs no NET_BIND_SERVICE: docker sets
    # ip_unprivileged_port_start=0 inside a non-host network namespace. No
    # read_only: nginx writes to tmp paths at runtime, not worth the breakage
    # risk to verify today.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # Nothing rotates docker's json-file driver by default, so any log path a
    # remote party can drive - and the relay has several - fills the host
    # volume and takes every other service down with it. 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - relay
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.awful2-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.awful2-http.entrypoints=web
      - traefik.http.routers.awful2-http.middlewares=awful2-redirect
      - traefik.http.middlewares.awful2-redirect.redirectscheme.scheme=https
      # Same reasoning as relay-sec above: the 301 upgrades one request, this
      # is what stops the next one starting in plain text. Content-Security-
      # Policy is not here - it lives in frontend/nginx.conf, next to the app
      # whose sources it describes.
      - traefik.http.middlewares.awful2-sec.headers.stsSeconds=63072000
      - traefik.http.middlewares.awful2-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.awful2-sec.headers.stsPreload=true
      - traefik.http.middlewares.awful2-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.awful2-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.awful2-sec.headers.frameDeny=true
      - traefik.http.routers.awful2-https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.awful2-https.entrypoints=websecure
      - traefik.http.routers.awful2-https.middlewares=awful2-sec
      - traefik.http.routers.awful2-https.tls=true
      - traefik.http.routers.awful2-https.tls.certresolver=letsencrypt
      - traefik.http.services.awful2-service.loadbalancer.server.port=80
      - traefik.http.routers.awful2-https.service=awful2-service
      - traefik.http.routers.awful2-http.service=awful2-service

volumes:
  relay_data:

networks:
  dokploy-network:
    external: true
