services:
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile.dev
    ports:
      # 8080 is the libp2p WebSocket listener; 8081 is the API mux that serves
      # /og, /klipy and /turn-credentials. In production Traefik splits those
      # by path onto the right internal port - locally there is no router, so
      # 8081 has to be published or none of those endpoints exist at all.
      - "8080:8080"
      - "8081:8081"
    volumes:
      - relay_data:/app/data
      - ./relay:/app
    environment:
      NODE_ENV: development
      HTTP_PORT: "8080"
      KLIPY_API_KEY: ${KLIPY_API_KEY:-dev-key}
      # On locally, so the dashboard works out of the box: the relay stores
      # uploaded bundles and serves the two operator read endpoints.
      TELEMETRY_ENABLED: "1"
      TELEMETRY_ADMIN_TOKEN: dev
    networks:
      - local-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_SFU_URL: ${VITE_SFU_URL:-http://localhost:3000}
      # 8081, not 8080: every VITE_API_URL fetch (klipy, og/preview,
      # turn-credentials) is served by the API mux, and 8080 is a libp2p
      # WebSocket listener that answers none of them.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
      # Port 8080 to match the listener above. Nothing has ever listened on
      # 9000. QmRelay is still a placeholder - replace it with the peer id the
      # relay prints on boot.
      VITE_RELAY_MULTIADDR: ${VITE_RELAY_MULTIADDR:-/ip4/127.0.0.1/tcp/8080/ws/p2p/QmRelay}
    depends_on:
      - relay
    networks:
      - local-network

  sfu:
    build:
      context: ./sfu
    ports:
      - "3001:3000"
      - "40000-40003:40000-40003/udp"
      - "40000-40003:40000-40003/tcp"
    environment:
      NODE_ENV: development
      SFU_PORT: "3000"
      ANNOUNCED_IP: "127.0.0.1"
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "40003"
      # On locally: answers ms:diag and prints one [sfu-telemetry] line per
      # room per sweep, which `docker logs -t` then feeds to the dashboard.
      SFU_TELEMETRY: "1"
    networks:
      - local-network

volumes:
  relay_data:

networks:
  local-network:
    driver: bridge
